# Online Actief Bot bekijkt elke pull request en zet opmerkingen bij de regels waar iets mis is.
# Opnieuw laten kijken of iets vragen: begin een reactie in de pull request met "@oa-bot".
#
# De bot mag alleen lezen en reageren. Hij kan geen code wijzigen, niets samenvoegen
# en niets goedkeuren. Een review vervangt de controle door de reviewer niet.
#
# Beveiliging:
# - De workflow draait altijd zoals hij op main staat (pull_request_target). Een aanpassing aan dit
#   bestand in een branch heeft dus geen effect tot die is goedgekeurd en samengevoegd.
# - De code uit de pull request wordt alleen gelezen, nooit uitgevoerd. De actie zet de
#   Claude-instellingen (.claude/, CLAUDE.md enz.) terug naar die van main.
# - De geheimen staan in de omgeving "bot" van deze repo, die alleen vanaf main bruikbaar is.
#   Een workflow uit een branch kan er niet bij.
#
# Nodig in de omgeving "bot": CLAUDE_CODE_OAUTH_TOKEN, OA_BOT_PRIVATE_KEY en RESEND_API_KEY.
# Organisatievariabelen: OA_BOT_APP_ID, REVIEW_MAIL en REVIEWER_NAAM.
name: Review

# zizmor: pull_request_target is bewust: alleen lezen, geen PR-code uitvoeren, geheimen alleen vanaf main.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Geen rechten voor het workflowtoken. De bot gebruikt zijn eigen token met beperkte rechten.
permissions: {}

jobs:
  review:
    name: Review
    if: >-
      github.event_name == 'pull_request_target'
      && !github.event.pull_request.draft
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: bot
      deployment: false
    concurrency:
      group: review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Token van Online Actief Bot
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.OA_BOT_APP_ID }}
          private-key: ${{ secrets.OA_BOT_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write
          permission-actions: read

      # De actie haalt de branch van de pull request zelf op en heeft daarvoor de inloggegevens nodig.
      # Deze workflow maakt geen artifacts, dus die gegevens kunnen nergens heen.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:  # zizmor: ignore[artipacked]
          fetch-depth: 0
          token: ${{ steps.bot.outputs.token }}

      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.bot.outputs.token }}
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            Review deze pull request. Lees eerst de beschrijving en de volledige wijziging met `gh pr view` en `gh pr diff`. Open andere bestanden in de repo als je moet weten hoe iets samenhangt. Lees CONTRIBUTING.md en README.md als die er zijn.

            Waar je op let, in deze volgorde:
            1. Beveiliging. Geheimen in code of config, injectie (SQL, shell, HTML), ontbrekende controle op wie iets mag, persoonsgegevens in logs of mails.
            2. Fouten. Code die niet doet wat de pull request belooft, randgevallen die crashen, data die verloren kan gaan.
            3. Uitrol. Nieuwe instellingen die niet in .env.example staan, databasewijzigingen zonder migratie, iets dat bestaande data breekt.
            4. Onderhoud. Dubbele code, onduidelijke namen, ontbrekende tests voor nieuwe logica.

            Regels voor je opmerkingen:
            - Plaats per probleem één opmerking op de regel zelf, met mcp__github_inline_comment__create_inline_comment.
            - Begin elke opmerking met het niveau: `🔴 **Blokkerend**` (moet opgelost voor samenvoegen), `🟠 **Belangrijk**` (beter nu oplossen) of `🟡 **Klein**` (mag later).
            - Zeg in één of twee zinnen wat er mis is en wanneer het misgaat. Geef een concrete oplossing, met code als dat helpt.
            - Alleen wat je zeker weet. Twijfel je, zeg dan wat iemand moet controleren in plaats van iets te beweren.
            - Geen opmerkingen over smaak of opmaak. Geen complimenten, geen herhaling van wat de code doet, geen algemene adviezen.
            - Hooguit tien opmerkingen. Kies de belangrijkste.

            Plaats daarna één samenvatting met `gh pr comment`, in precies deze vorm:

            ## 🤖 Review van Online Actief Bot

            **Oordeel:** ✅ Kan samengevoegd worden, of: ⛔ Eerst de blokkerende punten oplossen

            | | Niveau | Aantal |
            |---|---|---|
            | 🔴 | Blokkerend | n |
            | 🟠 | Belangrijk | n |
            | 🟡 | Klein | n |

            Daaronder per niveau een kopje (`### 🔴 Blokkerend` enz.) met één regel per punt: wat er mis is en het bestand met regelnummer. Laat een niveau zonder punten weg. Is er niets gevonden, schrijf dan alleen "✅ Geen problemen gevonden." onder het oordeel.

            Kies daarna drie labels, één uit elke groep. Je zet ze niet zelf, een vaste stap na jou doet dat op basis van je samenvatting.
            - Prio, hoe snel moet een developer kijken: `prio: hoog` (blokkerende punten of een beveiligingsfix), `prio: middel` (gewone wijziging), `prio: laag` (tekst, documentatie, kleine opruiming).
            - Risico, hoe groot de kans is dat het live iets stukmaakt: `risico: hoog` (login, rechten, versleuteling, data, database, uitrol of server), `risico: middel` (werking van de app), `risico: laag` (tekst, documentatie, tests, opmaak).
            - Categorie, wat voor wijziging het is: `functie`, `fout`, `beveiliging`, `onderhoud`, `documentatie` of `tests`. Kies de belangrijkste.

            Zet onder de tabel in de samenvatting precies deze regel, met de gekozen labels letterlijk zoals hierboven:
            `**Labels:** prio: hoog, risico: middel, fout`

            Sluit af met precies deze regel: `<sub>⚠️ Deze review is gemaakt met AI en kan fouten bevatten. Doorgestuurd naar ${{ vars.REVIEWER_NAAM || 'de reviewer' }} ter controle en goedkeuring. Opnieuw laten kijken: reageer met @oa-bot.</sub>`

            Schrijf in gewoon Nederlands, kort en direct, zonder gedachtestreepjes.

      # Zet de labels uit de samenvatting op de pull request. Alleen labels uit de vaste lijst,
      # zodat de review zelf geen andere wijzigingen aan de pull request kan doen.
      - name: Labels zetten
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          mag() {
            case "$1" in
              "prio: hoog"|"prio: middel"|"prio: laag"|"risico: hoog"|"risico: middel"|"risico: laag") return 0 ;;
              functie|fout|beveiliging|onderhoud|documentatie|tests) return 0 ;;
              *) return 1 ;;
            esac
          }
          samenvatting=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '[.[] | select(.user.login == "online-actief-bot[bot]" and (.body | contains("Review van Online Actief Bot")))] | last | .body // ""')
          regel=$(printf '%s\n' "$samenvatting" | grep -m1 '^\*\*Labels:\*\*' || true)
          if [ -z "$regel" ]; then echo "Geen labels in de samenvatting gevonden."; exit 0; fi
          IFS=',' read -ra gekozen <<< "${regel#'**Labels:** '}"
          nieuw=()
          for l in "${gekozen[@]}"; do
            l=$(echo "$l" | xargs)
            if mag "$l"; then nieuw+=("$l"); else echo "Overgeslagen: $l"; fi
          done
          [ "${#nieuw[@]}" -gt 0 ] || exit 0
          # Oude labels uit dezelfde groepen eraf, nieuwe erop.
          mapfile -t huidig < <(gh pr view "$PR" --json labels --jq '.labels[].name')
          for l in "${huidig[@]}"; do
            if mag "$l"; then gh pr edit "$PR" --remove-label "$l" >/dev/null; fi
          done
          for l in "${nieuw[@]}"; do gh pr edit "$PR" --add-label "$l" >/dev/null; echo "Label: $l"; done

      # Mail de uitkomst naar de reviewer, met prio, risico en categorie in het onderwerp.
      - name: Mail naar de reviewer
        if: ${{ !cancelled() && vars.REVIEW_MAIL != '' }}
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          TITEL: ${{ github.event.pull_request.title }}
          AUTEUR: ${{ github.event.pull_request.user.login }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          NAAR: ${{ vars.REVIEW_MAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then echo "Geen RESEND_API_KEY, dus geen mail."; exit 0; fi
          samenvatting=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '[.[] | select(.user.login == "online-actief-bot[bot]" and (.body | contains("Review van Online Actief Bot")))] | last | .body // ""')
          if [ -z "$samenvatting" ]; then echo "Geen samenvatting, dus geen mail."; exit 0; fi

          mapfile -t labels < <(gh pr view "$PR" --json labels --jq '.labels[].name')
          prio=""; risico=""; soort=""
          for l in "${labels[@]}"; do
            case "$l" in
              "prio: "*) prio=${l#prio: } ;;
              "risico: "*) risico=${l#risico: } ;;
              functie|fout|beveiliging|onderhoud|documentatie|tests) soort=$l ;;
            esac
          done
          [ -n "$soort" ] || soort="?"
          case "$prio" in hoog) icoon="🔴" ;; middel) icoon="🟠" ;; laag) icoon="🟢" ;; *) icoon="⚪" ;; esac
          repo=${GITHUB_REPOSITORY#*/}
          onderwerp="[$icoon Prio ${prio:-?} | Risico ${risico:-?} | ${soort^}] $repo #$PR: $TITEL"

          inhoud=$(jq -n --arg t "$samenvatting" --arg c "$GITHUB_REPOSITORY" '{text: $t, mode: "gfm", context: $c}' \
            | gh api -X POST markdown --input -)

          jq -n --arg van "Online Actief Bot <notificaties@mail.online-actief.nl>" --arg naar "$NAAR" \
            --arg onderwerp "$onderwerp" --arg inhoud "$inhoud" --arg titel "$TITEL" --arg auteur "$AUTEUR" \
            --arg url "$PR_URL" --arg repo "$repo" --arg nr "$PR" --arg tekst "$samenvatting" \
            --arg prio "${prio:-?}" --arg risico "${risico:-?}" --arg soort "${soort:-?}" '
            def kader($k; $w): "<span style=\"display:inline-block;padding:3px 10px;margin-right:6px;border-radius:12px;background:\($k);color:#fff;font-size:13px\">\($w)</span>";
            def kleur($w): if $w == "hoog" then "#d73a4a" elif $w == "middel" then "#fb8c00" elif $w == "laag" then "#2da44e" else "#6e7781" end;
            {
              from: $van, to: [$naar], subject: $onderwerp,
              text: "\($repo) #\($nr): \($titel)\nDoor \($auteur)\nPrio \($prio), risico \($risico), \($soort)\n\n\($tekst)\n\n\($url)",
              html: ("<div style=\"font-family:Arial,sans-serif;max-width:680px;margin:auto;color:#1b1f23\">"
                + "<div style=\"background:#40AE49;color:#fff;padding:16px 20px;border-radius:8px 8px 0 0\"><b>Online Actief Bot</b></div>"
                + "<div style=\"border:1px solid #d0d7de;border-top:0;padding:20px;border-radius:0 0 8px 8px\">"
                + "<div style=\"color:#57606a;font-size:13px\">\($repo | @html) #\($nr) door \($auteur | @html)</div>"
                + "<h2 style=\"margin:6px 0 12px\">\($titel | @html)</h2>"
                + "<p>" + kader(kleur($prio); "Prio \($prio)") + kader(kleur($risico); "Risico \($risico)") + kader("#1f6feb"; $soort) + "</p>"
                + $inhoud
                + "<p style=\"margin-top:20px\"><a href=\"\($url)\" style=\"background:#1b1f23;color:#fff;padding:10px 18px;border-radius:6px;text-decoration:none\">Bekijk de pull request</a></p>"
                + "</div></div>")
            }' > mail.json
          code=$(curl -s -o antwoord.json -w '%{http_code}' https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" -H "Content-Type: application/json" --data @mail.json)
          rm -f mail.json
          if [ "$code" -ge 300 ]; then echo "::warning::Mail niet verstuurd (HTTP $code)"; cat antwoord.json; exit 0; fi
          echo "Mail verstuurd naar $NAAR: $onderwerp"

  vraag:
    name: Vraag aan de bot
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request
        && startsWith(github.event.comment.body, '@oa-bot'))
      || (github.event_name == 'pull_request_review_comment'
        && startsWith(github.event.comment.body, '@oa-bot'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: bot
      deployment: false
    steps:
      - name: Token van Online Actief Bot
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.OA_BOT_APP_ID }}
          private-key: ${{ secrets.OA_BOT_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-issues: write
          permission-actions: read

      # De actie haalt de branch van de pull request zelf op en heeft daarvoor de inloggegevens nodig.
      # Deze workflow maakt geen artifacts, dus die gegevens kunnen nergens heen.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:  # zizmor: ignore[artipacked]
          fetch-depth: 0
          token: ${{ steps.bot.outputs.token }}

      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.bot.outputs.token }}
          trigger_phrase: "@oa-bot"
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
            --append-system-prompt "Je bent Online Actief Bot. Noem jezelf nooit Claude en zet geen handtekening of verwijzing naar een AI-dienst onder je antwoord. Antwoord in gewoon Nederlands, kort en direct, zonder gedachtestreepjes. Je mag alleen lezen en reageren, geen code wijzigen. Vraagt iemand om een nieuwe review, gebruik dan de niveaus 🔴 Blokkerend, 🟠 Belangrijk en 🟡 Klein."
